# speakerctl — Microsoft Modern USB-C Speaker configuration
# Edit this file to configure what each button does.
# After editing: sudo systemctl reload speakerctl

[device]
# USB identifiers — don't change unless you have a different hardware revision
vid = "045e"
pid = "083e"
# ALSA card name — shown by: cat /proc/asound/cards
alsa_card = "Speaker"

[startup]
# Volume levels (0-100%) applied on daemon start and after each reconnect.
# Comment out a line to leave that level untouched.
speaker_percent = 60
mic_percent = 85
# If set, also apply the same levels to this user's PulseAudio sink/source
# (ALSA and PulseAudio keep independent volumes — most desktop UIs show the
# PulseAudio one). Requires the sudoers rule installed by install.sh.
# pulse_user = "yourusername"

[aec]
# Load PulseAudio's module-echo-cancel into pulse_user's session, exposing a
# cancelled source and sink under fixed names. Anything that wants echo-free
# audio — a voice assistant, a conferencing app — can then just ask for them
# by name, instead of guessing at whatever the default device happens to be.
# Requires [startup] pulse_user, and the sudoers rule installed by install.sh.
# enabled = true
# source_name = "aec_mic"
# sink_name = "aec_speaker"
# method = "webrtc"

[lva]
# Keep volume and mute in step with a linux-voice-assistant running on this
# host, through its peripheral WebSocket API. Without this the speaker's
# buttons and the assistant each have their own idea of both.
#
# With sync_volume on, the volume buttons stop driving the local mixer and
# ask the assistant to change its own level instead — otherwise one press
# would attenuate twice, once in software and once in hardware, and the
# hardware half would also desync echo cancellation's playback reference.
# If the assistant is unreachable the buttons fall back to the mixer, so
# they never go dead.
#
# With sync_mute on, the hardware mute button tells the assistant, and a
# mute from Home Assistant is applied back to the microphone.
# enabled = true
# url = "ws://127.0.0.1:6055"
# sync_volume = true
# sync_mute = true

[volume_up]
command = "amixer -c Speaker -M set 'PCM' 5%+"

[volume_down]
command = "amixer -c Speaker -M set 'PCM' 5%-"

[mute]
# $STATE env var is set to "muted" or "unmuted" (post-toggle state).
# The kernel already handles the actual mute — this is for notifications.
command = "/etc/speakerctl/scripts/mute-notify.sh"

[teams]
command = "/etc/speakerctl/scripts/teams-button.sh"

[phone]
command = "/etc/speakerctl/scripts/phone-button.sh"
debounce_seconds = 0.5
